name: Create new release

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: build el9
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v6

      - name: install rpmdevtools
        run: |
          dnf install -y rpmdevtools

      - name: install build requirements
        run: |
          dnf builddep -y ipmi-power-exporter.spec

      - name: setup rpmdev tree
        run: |
          rpmdev-setuptree

      - name: link rpmdev directory
        run: |
          ln -s ~/rpmbuild

      - name: prepare SPEC file
        working-directory: rpmbuild/SPECS
        run: |
          ln -s "${GITHUB_WORKSPACE}/ipmi-power-exporter.spec"

      - name: define rpm version
        run: |
          echo "%exporter_version ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}" | tee ~/.rpmmacros

      - name: create source tarball
        run: |
          version=${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
          mkdir -p /tmp/ipmi-power-exporter-${version}
          cp -a "${GITHUB_WORKSPACE}/." /tmp/ipmi-power-exporter-${version}/
          tar czf ~/rpmbuild/SOURCES/${version}.tar.gz \
            -C /tmp ipmi-power-exporter-${version}

      - name: build rpm
        working-directory: rpmbuild/SPECS
        run: |
          rpmbuild  -ba ipmi-power-exporter.spec

      - name: list rpms
        working-directory: rpmbuild/RPMS/noarch
        run: |
          du -hs ./*.rpm

      - name: upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: rpmbuild/RPMS/noarch/*.rpm

  build-deb:
    name: build deb (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper

      - name: set package version
        run: |
          sed -i "s/VERSION/${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}/" debian/changelog

      - name: build deb package
        run: |
          dpkg-buildpackage -b -us -uc

      - name: list debs
        run: |
          du -hs ../*.deb

      - name: copy deb to workspace
        run: |
          cp ../*.deb .

      - name: upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: "*.deb"

  release:
    name: create release
    needs: [build, build-deb]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: download rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: rpm-package

      - name: download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: deb-package

      - name: create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            rpm-package/*.rpm
            deb-package/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
